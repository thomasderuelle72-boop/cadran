name: CI

# Cadran occupe désormais son propre dépôt : plus de filtre de chemin ni de
# répertoire de travail à décaler, la vérification porte sur tout le dépôt.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Le client Prisma est généré, pas versionné : sans cette étape, les
      # types importés depuis @prisma/client n'existent pas et tout le reste
      # échoue avec des erreurs trompeuses.
      - name: Générer le client Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Tests unitaires (moteurs de calcul)
        run: npm run test:api

      - name: Build API
        run: npm run build:api

      # Le build web enchaîne `tsc -b` puis Vite : il couvre le typage du
      # frontend en plus de la compilation.
      - name: Build web
        run: npm run build:web
